name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install tests/lint dependencies
        run: uv sync --locked --group test --group lint
      - name: Run Ruff linter
        run: uv run ruff check --quiet --output-format=concise
      - name: Run pymport
        run: uv run pymport .
      - name: Run tests and collect coverage
        run: uv run pytest tests/ --cov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rmoralespp/jsonl-diff
