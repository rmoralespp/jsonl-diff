name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-matrix:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # Lint and coverage run once, on the newest supported version.
      PRIMARY: ${{ matrix.python-version == '3.15' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install tests/lint dependencies
        run: uv sync --locked --group test --group lint
      - name: Run Ruff linter
        if: env.PRIMARY == 'true'
        run: uv run ruff check --quiet --output-format=concise
      - name: Run pymport
        if: env.PRIMARY == 'true'
        run: uv run pymport .

      - name: Run tests
        if: env.PRIMARY != 'true'
        run: uv run pytest tests/

      - name: Run tests and collect coverage
        if: env.PRIMARY == 'true'
        run: uv run pytest tests/ --cov=jsonl_diff --cov-report=xml:coverage.xml

      - name: Verify coverage report
        if: env.PRIMARY == 'true'
        run: test -s coverage.xml

      - name: Upload coverage reports to Codecov
        if: env.PRIMARY == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: rmoralespp/jsonl-diff
          files: coverage.xml
          fail_ci_if_error: true
          verbose: true

  tests:
    # Stable check name for branch protection, independent of the matrix versions.
    name: tests
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require all matrix jobs to succeed
        run: test "${{ needs.test-matrix.result }}" = success
